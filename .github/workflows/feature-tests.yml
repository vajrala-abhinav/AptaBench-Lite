name: Dashboard and engine tests
on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'integration/**'
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Install test browser
        run: |
          python -m playwright install --with-deps chromium
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Run regression and browser dashboard tests
        run: python -m pytest -q
