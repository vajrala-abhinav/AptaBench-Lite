name: Feature branch tests
on:
  push:
    branches:
      - feature/practical-review-pool-kd
      - fix/pool-kd-performance-privacy
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Run test suite
        run: python -m pytest -q --ignore=tests/test_browser_e2e.py
